name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_API_URL: https://nextrouter-api.onrender.com
        run: curl -sf "$RENDER_API_URL/api/health" || echo "Ping failed, service may be waking up"
